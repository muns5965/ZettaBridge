name: StyleTap ARM64 native build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/styletap-android17
    paths:
      - 'core/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/styletap-arm64.yml'

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out sources and Dynarmic
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libboost-dev
      - name: Install Android NDK r29 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Apply Dynarmic patches when available
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR="$GITHUB_WORKSPACE/patches"
          PATCHES=(
            "$PATCH_DIR/dynarmic-0001-thumb32-armv8.patch"
            "$PATCH_DIR/dynarmic-0002-asimd-narrowing.patch"
          )
          if [ -f "${PATCHES[0]}" ] && [ -f "${PATCHES[1]}" ]; then
            git -C third_party/dynarmic apply --check "${PATCHES[@]}"
            git -C third_party/dynarmic apply "${PATCHES[@]}"
          else
            echo "::warning::Dynarmic patch files are absent from this fork; compiling the pinned submodule without these patches."
            printf 'Missing patches: %s\n' "${PATCHES[@]}"
          fi
      - name: Prepare Boost headers for Android cross-compilation
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/include/boost/icl/interval_map.hpp
          mkdir -p build/boost-headers
          ln -sfn /usr/include/boost build/boost-headers/boost
          test -f build/boost-headers/boost/icl/interval_map.hpp
      - name: Configure Android ARM64
        run: |
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZB_BUILD_TESTS=OFF \
            -DBoost_INCLUDE_DIR="$GITHUB_WORKSPACE/build/boost-headers"
      - name: Build libzbridge.so
        run: cmake --build build/android-arm64 --target zbridge --parallel 2
      - name: Verify Android ARM64 ELF and JNI graphics dependency
        run: |
          LIB=build/android-arm64/core/libzbridge.so
          test -s "$LIB"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$LIB" | tee /tmp/styletap-elf-header.txt
          grep -q 'AArch64' /tmp/styletap-elf-header.txt
          "$READELF" -d "$LIB" | tee /tmp/styletap-elf-dynamic.txt
          grep -q 'libjnigraphics.so' /tmp/styletap-elf-dynamic.txt
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: styletap-arm64-libzbridge
          path: build/android-arm64/core/libzbridge.so
          if-no-files-found: error
